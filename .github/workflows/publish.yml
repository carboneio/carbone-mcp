name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # Allow manual runs from the GitHub Actions UI

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    permissions:
      id-token: write # Required for npm provenance and MCP Registry DNS auth
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Sync server.json version with the git tag (strips the leading "v")
      - name: Set version in server.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '
            .version = $v |
            .packages[] |= (
              .version = $v |
              if .registryType == "oci" then
                .identifier = ((.identifier | split(":")[0]) + ":" + $v)
              else . end
            )
          ' server.json > server.tmp && mv server.tmp server.json

      # Publish to npm using Trusted Publisher (OIDC — no NPM_TOKEN secret needed).
      # Skipped when this version is already on npm, so a failed later step can be re-run.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping npm publish"
          else
            npm publish --provenance
          fi

      # The MCP Registry checks that the npm version exists, and a fresh release can take a
      # moment to be served: wait for it rather than fail the registry step.
      - name: Wait until npm serves the new version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/$NAME/$VERSION"; then
              echo "$NAME@$VERSION is available on npm"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$NAME@$VERSION is still not served by npm after 5 minutes"
          exit 1

      # Publish to MCP Registry using DNS authentication for the io.carbone namespace.
      #
      # The binary is deliberately NOT pinned to a version: the registry requires it to track
      # the live deployment (an outdated one fails with "invalid audience" — see the upstream
      # troubleshooting guide). Freshness is therefore kept, and integrity comes from Sigstore
      # instead: upstream signs every release asset with keyless cosign, so the bundle is
      # verified against that release workflow's own identity before anything is extracted.
      # Downloading to a file first (rather than piping curl into tar) means unverified bytes
      # are never handed to the extractor.
      #
      # Every step below is tag-gated, like the npm publish above: on a workflow_dispatch run
      # there is no tag to derive a version from, so server.json would still hold whatever
      # version is committed and the registry would be published against stale metadata.
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher (Sigstore-verified)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          BASE="https://github.com/modelcontextprotocol/registry/releases/latest/download"
          ASSET="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o mcp-publisher.tar.gz "$BASE/$ASSET"
          curl -fsSL --proto '=https' --tlsv1.2 -o mcp-publisher.tar.gz.sigstore.json "$BASE/$ASSET.sigstore.json"
          cosign verify-blob \
            --bundle mcp-publisher.tar.gz.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/modelcontextprotocol/registry/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm -f mcp-publisher.tar.gz mcp-publisher.tar.gz.sigstore.json

      - name: Authenticate to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain carbone.io --private-key "$MCP_PRIVATE_KEY"

      # Skipped when this version is already on the registry; retried a few times in case the
      # registry still sees the previous npm metadata.
      - name: Publish to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          NAME=$(jq -r .name server.json)
          VERSION=$(jq -r .version server.json)
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$NAME" '$n|@uri')/versions/$VERSION"
          if curl -fsS -o /dev/null "$URL"; then
            echo "$NAME $VERSION is already on the MCP Registry, skipping"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Publish attempt $attempt failed, retrying in 30 s"
            sleep 30
          done
          exit 1