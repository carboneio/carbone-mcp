name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [lts/*, current]
    env:
      CI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Integration (e2e) tests run only when this secret is present; otherwise they self-skip.
          # Add it in repo Settings → Secrets and variables → Actions. Optionally also CARBONE_TEST_BASE_URL.
          CARBONE_TEST_API_KEY: ${{ secrets.CARBONE_TEST_API_KEY }}
